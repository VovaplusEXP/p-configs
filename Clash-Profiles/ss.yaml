proxy-groups:
- name: ⚡ Auto-Select-SS
  type: url-test
  proxies: &id001
  - SS-C20P-🇺🇸(US)-198.98.53.130
  - SS-C20P-🇩🇪(DE)-51.195.126.38
  - SS-A256GCM-🇷🇺(RU)-195.133.23.200
  - SS-C20P-🇵🇱(PL)-31.76.82.131
  - SS-A256GCM-🇨🇦(CA)-166.88.130.218
  - SS-A256GCM-🇭🇰(HK)-212.192.15.86
  tolerance: 50
  lazy: false
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 🔗 Auto-Failover-SS
  type: fallback
  proxies: *id001
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 📲 SS-Selector
  type: select
  proxies:
  - ⚡ Auto-Select-SS
  - 🔗 Auto-Failover-SS
  - SS-C20P-🇺🇸(US)-198.98.53.130
  - SS-C20P-🇩🇪(DE)-51.195.126.38
  - SS-A256GCM-🇷🇺(RU)-195.133.23.200
  - SS-C20P-🇵🇱(PL)-31.76.82.131
  - SS-A256GCM-🇨🇦(CA)-166.88.130.218
  - SS-A256GCM-🇭🇰(HK)-212.192.15.86
rule-providers:
  adblock:
    type: http
    url: https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/refs/heads/master/Filters/rules.txt
    behavior: domain
    interval: 86400
rules:
- RULE-SET,adblock,REJECT
- MATCH, 📲 SS-Selector
