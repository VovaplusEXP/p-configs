  fallback:
  - 8.8.8.8
  - 8.8.4.4
proxies:
- name: SS-C20P-🇵🇱(PL)-31.76.82.131
  type: ss
  server: 31.76.82.131
  port: 34260
  cipher: chacha20-ietf-poly1305
  password: cTAObwg4OWWXkZJQs0ZdgC
- name: SS-A256GCM-🇮🇹(IT)-57.131.48.45
  type: ss
  server: 57.131.48.45
  port: 8388
  cipher: aes-256-gcm
  password: itzvpn@321
- name: SS-C20P-🇱🇹(LT)-144.31.243.2
  type: ss
  server: 144.31.243.2
  port: 16015
  cipher: chacha20-ietf-poly1305
  password: J1InuU6QRT5JOh1mQfkjU2
proxy-groups:
- name: ⚡ Auto-Select-SS
  type: url-test
  proxies: &id001
  - SS-C20P-🇵🇱(PL)-31.76.82.131
  - SS-A256GCM-🇮🇹(IT)-57.131.48.45
  - SS-C20P-🇱🇹(LT)-144.31.243.2
  tolerance: 50
  lazy: false
  url: https://aistudio.google.com/prompts/new_chat
