  password: b61ca706-e2e9-4f6b-bd1e-0f0534a2fc41
proxy-groups:
- name: ⚡ Auto-Select-SS
  type: url-test
  proxies: &id001
  - SS-C20P-🇺🇸(US)-5.78.51.123
  - SS-C20P-🇫🇷(FR)-51.255.13.232
  - SS-A256GCM-🇮🇹(IT)-57.131.48.45
  - SS-aes-128-gcm-🇨🇦(CA)-catnet-other.kunlun04dns.com
  tolerance: 50
  lazy: false
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 🔗 Auto-Failover-SS
  type: fallback
  proxies: *id001
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 📲 SS-Selector
  type: select
  proxies:
  - ⚡ Auto-Select-SS
  - 🔗 Auto-Failover-SS
  - SS-C20P-🇺🇸(US)-5.78.51.123
  - SS-C20P-🇫🇷(FR)-51.255.13.232
  - SS-A256GCM-🇮🇹(IT)-57.131.48.45
  - SS-aes-128-gcm-🇨🇦(CA)-catnet-other.kunlun04dns.com
rule-providers:
  adblock:
    type: http
    url: https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/refs/heads/master/Filters/rules.txt
    behavior: domain
    interval: 86400
rules:
- RULE-SET,adblock,REJECT
- MATCH, 📲 SS-Selector
