port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
dns:
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
  - 1.1.1.1
  - 1.0.0.1
  fallback:
  - 8.8.8.8
  - 8.8.4.4
proxies:
- name: SS-C20P-🇨🇦(CA)-142.4.216.225
  type: ss
  server: 142.4.216.225
  port: 443
  cipher: chacha20-ietf-poly1305
  password: mrs2e9a
- name: SS-C20P-🇫🇷(FR)-51.255.13.232
  type: ss
  server: 51.255.13.232
  port: 8388
  cipher: chacha20-ietf-poly1305
  password: BqnqToih0PbU
- name: SS-C20P-🇹🇼(TW)-36.224.141.124
  type: ss
  server: 36.224.141.124
  port: 50099
  cipher: chacha20-ietf-poly1305
  password: 7e731ec3-f8e1-43f6-92cf-3978d14705c4
- name: SS-C20P-🇵🇱(PL)-54.36.174.140
  type: ss
  server: 54.36.174.140
  port: 443
  cipher: chacha20-ietf-poly1305
  password: mrs2e9a
- name: SS-A256GCM-🇫🇮(FI)-87.58.148.70
  type: ss
  server: 87.58.148.70
  port: 443
  cipher: aes-256-gcm
  password: rg0g3xp9rk9nk9o0
proxy-groups:
- name: ⚡ Auto-Select-SS
  type: url-test
  proxies: &id001
  - SS-C20P-🇨🇦(CA)-142.4.216.225
  - SS-C20P-🇫🇷(FR)-51.255.13.232
  - SS-C20P-🇹🇼(TW)-36.224.141.124
  - SS-C20P-🇵🇱(PL)-54.36.174.140
  - SS-A256GCM-🇫🇮(FI)-87.58.148.70
  tolerance: 50
  lazy: false
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 🔗 Auto-Failover-SS
  type: fallback
  proxies: *id001
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 📲 SS-Selector
  type: select
  proxies:
  - ⚡ Auto-Select-SS
  - 🔗 Auto-Failover-SS
  - SS-C20P-🇨🇦(CA)-142.4.216.225
  - SS-C20P-🇫🇷(FR)-51.255.13.232
  - SS-C20P-🇹🇼(TW)-36.224.141.124
  - SS-C20P-🇵🇱(PL)-54.36.174.140
  - SS-A256GCM-🇫🇮(FI)-87.58.148.70
rule-providers:
  adblock:
    type: http
    url: https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/refs/heads/master/Filters/rules.txt
    behavior: domain
    interval: 86400
rules:
- RULE-SET,adblock,REJECT
- MATCH, 📲 SS-Selector
