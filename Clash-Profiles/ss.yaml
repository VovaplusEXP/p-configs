port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
dns:
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
  - 1.1.1.1
  - 1.0.0.1
  fallback:
  - 8.8.8.8
  - 8.8.4.4
proxies:
- name: SS-A256GCM-🇨🇦(CA)-166.88.130.218
  type: ss
  server: 166.88.130.218
  port: 50111
  cipher: aes-256-gcm
  password: fbcec76953a2d173
- name: SS-C20P-🇨🇦(CA)-ca225.vpnbook.com
  type: ss
  server: ca225.vpnbook.com
  port: 443
  cipher: chacha20-ietf-poly1305
  password: 3ssumf2
- name: SS-C20P-🇵🇱(PL)-31.76.82.131
  type: ss
  server: 31.76.82.131
  port: 34260
  cipher: chacha20-ietf-poly1305
  password: cTAObwg4OWWXkZJQs0ZdgC
- name: SS-C20P-🇺🇸(US)-5.78.51.123
  type: ss
  server: 5.78.51.123
  port: 1080
  cipher: chacha20-ietf-poly1305
  password: 8tmnvX5zYuWGVIDP2jglZw
proxy-groups:
- name: ⚡ Auto-Select-SS
  type: url-test
  proxies: &id001
  - SS-A256GCM-🇨🇦(CA)-166.88.130.218
  - SS-C20P-🇨🇦(CA)-ca225.vpnbook.com
  - SS-C20P-🇵🇱(PL)-31.76.82.131
  - SS-C20P-🇺🇸(US)-5.78.51.123
  tolerance: 50
  lazy: false
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 🔗 Auto-Failover-SS
  type: fallback
  proxies: *id001
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 📲 SS-Selector
  type: select
  proxies:
  - ⚡ Auto-Select-SS
  - 🔗 Auto-Failover-SS
  - SS-A256GCM-🇨🇦(CA)-166.88.130.218
  - SS-C20P-🇨🇦(CA)-ca225.vpnbook.com
  - SS-C20P-🇵🇱(PL)-31.76.82.131
  - SS-C20P-🇺🇸(US)-5.78.51.123
rule-providers:
  adblock:
    type: http
    url: https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/refs/heads/master/Filters/rules.txt
    behavior: domain
    interval: 86400
rules:
- RULE-SET,adblock,REJECT
- MATCH, 📲 SS-Selector
