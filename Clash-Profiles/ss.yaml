port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
dns:
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
  - 1.1.1.1
  - 1.0.0.1
  fallback:
  - 8.8.8.8
  - 8.8.4.4
proxies:
- name: SS-A256GCM-🌐(XX)-57.131.48.45
  type: ss
  server: 57.131.48.45
  port: 8388
  cipher: aes-256-gcm
  password: itzvpn@321
- name: SS-A256GCM-🇨🇦(CA)-166.88.130.218
  type: ss
  server: 166.88.130.218
  port: 10889
  cipher: aes-256-gcm
  password: fbcec76953a2d173
- name: SS-A256GCM-🇷🇺(RU)-45.140.169.123
  type: ss
  server: 45.140.169.123
  port: 10889
  cipher: aes-256-gcm
  password: 6b39ae3234dfd68b
- name: SS-A256GCM-🇭🇰(HK)-212.192.15.246
  type: ss
  server: 212.192.15.246
  port: 10889
  cipher: aes-256-gcm
  password: 72553320ae6bcc8f
proxy-groups:
- name: ⚡ Auto-Select-SS
  type: url-test
  proxies: &id001
  - SS-A256GCM-🌐(XX)-57.131.48.45
  - SS-A256GCM-🇨🇦(CA)-166.88.130.218
  - SS-A256GCM-🇷🇺(RU)-45.140.169.123
  - SS-A256GCM-🇭🇰(HK)-212.192.15.246
  tolerance: 50
  lazy: false
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 🔗 Auto-Failover-SS
  type: fallback
  proxies: *id001
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 📲 SS-Selector
  type: select
  proxies:
  - ⚡ Auto-Select-SS
  - 🔗 Auto-Failover-SS
  - SS-A256GCM-🌐(XX)-57.131.48.45
  - SS-A256GCM-🇨🇦(CA)-166.88.130.218
  - SS-A256GCM-🇷🇺(RU)-45.140.169.123
  - SS-A256GCM-🇭🇰(HK)-212.192.15.246
rule-providers:
  adblock:
    type: http
    url: https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/refs/heads/master/Filters/rules.txt
    behavior: domain
    interval: 86400
rules:
- RULE-SET,adblock,REJECT
- MATCH, 📲 SS-Selector
