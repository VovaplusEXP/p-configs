port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
dns:
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
  - 1.1.1.1
  - 1.0.0.1
  fallback:
  - 8.8.8.8
  - 8.8.4.4
proxies:
- name: SS-C20P-🇩🇪(DE)-5.75.192.44
  type: ss
  server: 5.75.192.44
  port: 1080
  cipher: chacha20-ietf-poly1305
  password: IXa3ylzS_jBOAsQy071tIQ
- name: SS-C20P-🌐(XX)-51.255.13.232
  type: ss
  server: 51.255.13.232
  port: 8388
  cipher: chacha20-ietf-poly1305
  password: BqnqToih0PbU
- name: SS-C20P-🇹🇼(TW)-36.224.185.173
  type: ss
  server: 36.224.185.173
  port: 50099
  cipher: chacha20-ietf-poly1305
  password: b1ae0fce-9340-4f2e-882d-fdb2218e2e2b
proxy-groups:
- name: ⚡ Auto-Select-SS
  type: url-test
  proxies: &id001
  - SS-C20P-🇩🇪(DE)-5.75.192.44
  - SS-C20P-🌐(XX)-51.255.13.232
  - SS-C20P-🇹🇼(TW)-36.224.185.173
  tolerance: 50
  lazy: false
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 🔗 Auto-Failover-SS
  type: fallback
  proxies: *id001
  url: https://aistudio.google.com/prompts/new_chat
  interval: 180
  regex: Sign in|^(?!.*Permission denied).*gemini
- name: 📲 SS-Selector
  type: select
  proxies:
  - ⚡ Auto-Select-SS
  - 🔗 Auto-Failover-SS
  - SS-C20P-🇩🇪(DE)-5.75.192.44
  - SS-C20P-🌐(XX)-51.255.13.232
  - SS-C20P-🇹🇼(TW)-36.224.185.173
rule-providers:
  adblock:
    type: http
    url: https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/refs/heads/master/Filters/rules.txt
    behavior: domain
    interval: 86400
rules:
- RULE-SET,adblock,REJECT
- MATCH, 📲 SS-Selector
