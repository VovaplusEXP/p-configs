  port: 1080
  cipher: chacha20-ietf-poly1305
  password: 8tmnvX5zYuWGVIDP2jglZw
- name: SS-C20P-🇫🇷(FR)-51.255.13.232
  type: ss
  server: 51.255.13.232
  port: 8388
  cipher: chacha20-ietf-poly1305
  password: BqnqToih0PbU
- name: SS-A256GCM-🇮🇹(IT)-57.131.48.45
  type: ss
  server: 57.131.48.45
  port: 8388
  cipher: aes-256-gcm
  password: itzvpn@321
- name: SS-aes-128-gcm-🇨🇦(CA)-catnet-other.kunlun04dns.com
  type: ss
  server: catnet-other.kunlun04dns.com
  port: 28046
